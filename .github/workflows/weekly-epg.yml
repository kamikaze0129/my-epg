name: Weekly EPG rebuild

on:
  schedule:
    - cron: '0 15 * * 0,2,4' # Runs Sundays, Tuesdays, Thursdays at 15:00 UTC
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Suffix appended to the release tag (for testing, e.g. -test1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
         
      - name: Download previous EPG build
        run: |
          curl -fL --retry 3 -o prev_epg.xml \
            https://github.com
          ls -la prev_epg.xml
          head -c 200 prev_epg.xml | grep -q '<tv' || { echo "downloaded file is not XMLTV"; exit 1; }
          echo "previous build downloaded OK"

      # FIXED: Removed the day restriction. This now pulls FRESH, LIVE data 
      # from your provider on Sundays, Tuesdays, AND Thursdays seamlessly.
      - name: Pull provider EPG
        env:
          IPTV_HOST: ${{ secrets.IPTV_HOST }}
          IPTV_USER: ${{ secrets.IPTV_USER }}
          IPTV_PASS: ${{ secrets.IPTV_PASS }}
          PROVIDER_PULL_BUDGET_S: '12600'
        run: |
          python3 epg/pull_provider_epg.py --out "$GITHUB_WORKSPACE/provider_epg_fresh.xml"
          ls -la "$GITHUB_WORKSPACE/provider_epg_fresh.xml"

           - name: Weekly rebuild
        env:
          EPG_PREV_BUILD: ${{ github.workspace }}/prev_epg.xml
          EPG_RUNS_DIR: ${{ github.workspace }}/run_out
          EPG_SERVICE_XML: ${{ github.workspace }}/provider_epg_fresh.xml
        run: |
          mkdir -p run_out
          python3 epg/weekly_build.py --no-promote --out "$GITHUB_WORKSPACE/epg_new.xml"
          pip install beautifulsoup4 requests # Installs the scraper requirements
          python3 epg/append_tvpassport.py

      - name: Build 24/7 EPG
        run: |
          python3 epg/build_247_epg.py --manifest epg/247_manifest.json --out "$GITHUB_WORKSPACE/epg_247.xml"
          ls -la "$GITHUB_WORKSPACE/epg_247.xml"

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-run-report
          path: run_out/
          retention-days: 30

      - name: Cut dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(TZ=America/New_York date +%Y.%m.%d)${{ inputs.tag_suffix }}"
          TITLE="EPG $(TZ=America/New_York date +%Y-%m-%d)${{ inputs.tag_suffix }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping release creation gracefully."
            exit 0
          fi
          cp "$GITHUB_WORKSPACE/epg_new.xml" "$GITHUB_WORKSPACE/epg.xml"
          gh release create "$TAG" "$GITHUB_WORKSPACE/epg.xml" "$GITHUB_WORKSPACE/epg_247.xml" \
            --title "$TITLE" \
            --notes "Weekly automated EPG rebuild. Main guide: https://github.com | 24/7 marathon guide: https://github.com"
